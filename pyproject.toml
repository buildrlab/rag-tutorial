[project]
name = "rag-workbench"
version = "0.1.0"
description = "An inspectable RAG field guide, local lab, and developer starter."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "qdrant-client>=1.15,<1.16", "pypdf>=6,<7", "python-multipart>=0.0.20,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
