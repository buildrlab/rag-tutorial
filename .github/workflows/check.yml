name: Starter checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pytest==9.2.0
      - run: python -m pytest -q
      - run: python -m scripts.evaluate > evaluation-results.json
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.local.yaml config -q
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose down
